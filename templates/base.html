<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Finance Manager{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
        }
        .card {
            border: none;
            border-radius: 1.25rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        .btn-primary {
            background: linear-gradient(135deg, #36d1dc, #5b86e5);
            border: none;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        .navbar {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
        }
        .navbar-brand,
        .nav-link {
            color: #fff !important;
            font-weight: 500;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
        footer {
            color: #ccc;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="{% url 'expense_list' %}">💰 Finance Manager</a>

        {% if user.is_authenticated %}
        <div class="d-flex gap-3">
            <a href="{% url 'category_list' %}" class="nav-link d-inline">Категорії</a>
            <a href="{% url 'expense_list' %}" class="nav-link d-inline">Витрати</a>
            <a href="{% url 'accounts:profile' %}" class="nav-link d-inline">Профіль</a>
            <a href="{% url 'accounts:logout' %}" class="nav-link d-inline">Вийти</a>
        </div>
        {% else %}
        <div class="d-flex gap-3">
            <a href="{% url 'accounts:custom_login' %}" class="nav-link d-inline">Увійти</a>
            <a href="{% url 'accounts:signup' %}" class="nav-link d-inline">Реєстрація</a>
        </div>
        {% endif %}
    </div>
</nav>

<div class="container py-5">
    {% block content %}{% endblock %}
</div>

<footer class="text-center py-4">
    Finance Manager © 2025
</footer>

</body>
</html>
