{% extends "base.html" %}
{% block title %}Підтвердження поповнення{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 text-center">
            <h4 class="mb-3">💳 Підтвердити поповнення</h4>

            <p class="text-muted">
                Введіть суму для поповнення балансу ({{ currency }})
            </p>

            <form method="post">
                {% csrf_token %}

                <input type="number"
                       step="0.01"
                       name="amount"
                       class="form-control mb-3"
                       placeholder="Сума">

                <button type="submit" class="btn btn-primary w-100">
                    Підтвердити
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
