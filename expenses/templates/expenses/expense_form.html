{% extends "base.html" %}
{% block title %}Нова витрата{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h3 class="text-center mb-4 text-black">➕ Додати витрату</h3>

            <form method="post">
                {% csrf_token %}

                {{ form.as_p }}

                <div class="mb-3">
                    <a href="{% url 'create_category' %}" class="text-info">
                        ➕ Додати нову категорію
                    </a>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Зберегти
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
