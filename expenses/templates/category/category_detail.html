{% extends 'base.html' %}
{% block title %}Категорія{% endblock %}
{% block content %}
    <div class="card p-4 text-center">
        <i class="{{ category.icon }}"></i>
        <h3>{{ category.name }}</h3>
        <div class="mt-3">
            <a href="{% url 'update_category' category.id %}" class="btn btn-primary">Редагувати</a>
            <a href="{% url 'delete_category' category.id %}" class="btn btn-danger">Видалити</a>
        </div>
    </div>
{% endblock %}
