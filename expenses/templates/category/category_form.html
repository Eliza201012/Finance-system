{% extends "base.html" %}
{% block title %}Нова категорія{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4">
            <h3 class="text-center mb-4 text-black">📁 Додати категорію</h3>

            <form method="post">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-primary w-100">
                    Зберегти
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
