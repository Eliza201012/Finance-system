{% extends 'base.html' %}
{% block title %}Категорії{% endblock %}
{% block content %}
<div class="card p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Категорії</h3>
        <a href="{% url 'create_category' %}" class="btn btn-primary">+ Додати</a>
    </div>
    <ul class="list-group">
        {% for category in categories %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <p>
                    <i class="{{ category.icon }}"></i>
                    {{ category.name }}
                </p>
                <span>
                <a href="{% url 'category_detail' category.id %}" class="btn btn-sm btn-outline-secondary">Перегляд</a>
                <a href="{% url 'update_category' category.id %}" class="btn btn-sm btn-outline-primary">Редагувати</a>
                </span>
            </li>
            {% empty %}
            <li class="list-group-item">Категорій поки немає</li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
