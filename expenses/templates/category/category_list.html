{% extends "base.html" %}
{% block title %}Категорії{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4">

            <h3 class="mb-4 text-black">📁 Категорії</h3>

            <a href="{% url 'create_category' %}" class="btn btn-primary mb-3">
                ➕ Додати категорію
            </a>

            <ul class="list-group">
                {% for category in categories %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <p>
                            <i class="{{ category.icon }}"></i>
                            {{ category.name }}
                        </p>
                        <span>
                            <a href="{% url 'update_category' category.id %}" class="btn btn-sm btn-outline-secondary">
                                ✏️
                            </a>
                            <a href="{% url 'delete_category' category.id %}" class="btn btn-sm btn-outline-danger">
                                🗑
                            </a>
                        </span>
                    </li>
                {% empty %}
                    <li class="list-group-item text-muted">
                        Категорій ще немає
                    </li>
                {% endfor %}
            </ul>

        </div>
    </div>
</div>
{% endblock %}
